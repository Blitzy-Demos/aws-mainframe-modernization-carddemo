# CardDemo local development and test broker (RabbitMQ 3.13).
#
# Mounted read-only at /etc/rabbitmq/rabbitmq.conf by modern/compose.yaml and by
# crates/test-support/src/rabbitmq.rs, so local runs and broker-backed tests boot alike.
# At boot the broker imports definitions.json: the vhost, the local-only user, its
# permissions and the seven durable queues. No user, vhost or queue is declared here.
# The image's own conf.d defaults and enabled management plugin still apply.
load_definitions = /etc/rabbitmq/definitions.json
