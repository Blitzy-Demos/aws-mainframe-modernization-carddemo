# cargo-deny policy for the CardDemo workspace, run from modern/ as `cargo deny check`
# (scripts/check.sh step 10). Written for cargo-deny 0.18 and its current config schema.
# Advisories need the RustSec database, which cargo-deny fetches from its default source.

[graph]
all-features = false

[advisories]
yanked = "deny"
# Each entry is one advisory against a version the pinned stack cannot leave, accepted by the
# ESCALATIONS.md row its reason cites. Ignores are by advisory ID only, never by crate, so a new
# advisory against the same crate still fails the check.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant@0.1.13 fixed by pin (lapin 2.5.5, the last 2.x, via async-io 1); see ESCALATIONS E35" },
    { id = "RUSTSEC-2024-0436", reason = "paste@1.0.15 fixed by pin (utoipa-axum 0.2.0, the only 0.2.x); see ESCALATIONS E36" },
    { id = "RUSTSEC-2025-0111", reason = "tokio-tar@0.3.1 fixed by pin (testcontainers 0.23.3, dev-only; no fixed release); see ESCALATIONS E37" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile@2.2.0 fixed by pin (testcontainers 0.23.3 via bollard, lapin 2.5.5 via tcp-stream); see ESCALATIONS E38" },
    { id = "RUSTSEC-2026-0009", reason = "time@0.3.41 fixed by pin (Rust 1.85; the fix 0.3.47 needs 1.88); see ESCALATIONS E39" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2@2.0.1 fixed by pin (validator 0.19.0, the only 0.19.x); see ESCALATIONS E40" },
    { id = "RUSTSEC-2026-0187", reason = "lopdf@0.31.0 fixed by pin (printpdf 0.7.0 requires ^0.31; the fix is 0.42); see ESCALATIONS E41" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser@0.19.2 fixed by pin (printpdf 0.7.0 via owned_ttf_parser 0.19); see ESCALATIONS E42" },
]

[licenses]
confidence-threshold = 0.8
# Exactly the permissive licences the resolved graph uses; cargo-deny warns on an entry no crate
# needs, so add one only when a new dependency requires it. No copyleft licence is admitted: a
# crate offering one only as an alternative (r-efi: MIT OR Apache-2.0 OR LGPL-2.1-or-later)
# passes through its permissive option.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The workspace members are publish = false; their licence is the repository's own.
[licenses.private]
ignore = true

[bans]
# The graph carries unavoidable duplicate lines (rand 0.8/0.9, thiserror 1/2, windows-sys);
# a warning reports them without failing the check.
multiple-versions = "warn"
wildcards = "deny"
# The internal crates are path dependencies without a version; allowed because every member is
# private.
allow-wildcard-paths = true
# Cloud SDK crates (Local-Only Runtime). Names match exactly, so the aws-sdk-*, aws-smithy-*,
# azure_* and google-cloud-* families are caught by the Cargo.lock scan in scripts/check.sh.
# Crypto crates such as aws-lc-rs are not SDKs and are not banned. Entries use the current
# `crate` package-spec key; cargo-deny 0.18 keeps the `name` table form only as a legacy fallback.
deny = [
    { crate = "aws-config", reason = "cloud SDK: build, test and run are local-only" },
    { crate = "aws-types", reason = "cloud SDK: build, test and run are local-only" },
    { crate = "aws-credential-types", reason = "cloud SDK: build, test and run are local-only" },
    { crate = "gcp_auth", reason = "cloud SDK: build, test and run are local-only" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies and no submodules: crates.io is the only source.
allow-git = []
