[package]
name = "api"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CardDemo REST API: the online CICS transactions as axum endpoints with an OpenAPI contract"

# Storage is reached only through `persistence` repository traits; the pool from
# `runtime::db::connect` flows into `PgStore::new` by inference, so no direct database crate.
# PIC types come through the `domain::copybook` re-export.
[dependencies]
domain = { workspace = true }
persistence = { workspace = true }
runtime = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
jsonwebtoken = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "decimal"] }
utoipa-axum = { workspace = true }
validator = { workspace = true, features = ["derive"] }

[dev-dependencies]
test-support = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json"] }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
