[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
description = "CardDemo shared runtime: env configuration, telemetry, PgPool, GDG naming, the migration entrypoint"

[lib]
path = "src/lib.rs"

# The only operator path to the schema (Single Schema Executor); no second binary.
[[bin]]
name = "carddemo-migrate"
path = "src/bin/carddemo-migrate.rs"

# No query macros and no internal or HTTP crate, so this crate builds against an empty
# database. No TLS feature and no network telemetry exporter (Local-Only Runtime).
[dependencies]
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
opentelemetry-stdout = { workspace = true, features = ["trace"] }
tracing-opentelemetry = { workspace = true }

[lints]
workspace = true
